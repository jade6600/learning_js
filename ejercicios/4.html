<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargar una lista plegable con nombre de imágenes que tienes guardadas en disco y cuando se seleccione una de la lista, visualizar esa imagen.</title>
</head>
<body>
    <select id="nombreImagen" onchange="cambiar()">
        <option value="img/imagen1.jpg">Imagen 1</option>
        <option value="img/imagen2.jpg">Imagen 2</option>
        <option value="img/imagen3.jpg">Imagen 3</option>
    </select>
    <br><br>
    <img id="imagen" src="img/imagen1.jpg"
        alt="Imagen seleccionada" width="300">
    <script>
        function cambiar() {
            nombreImagen = document.getElementById("nombreImagen").value;
            document.getElementById("imagen").src = nombreImagen;
        }
    </script>
</body>
</html>
