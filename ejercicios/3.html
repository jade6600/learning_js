<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title> Solicitar en un `<input>` un texto y mostrarlo en una capa `<div>` pulsando sobre un botón.</title>
</head>
<body>
    <input type="text" id="idTexto">
    <button onclick="mostrarTexto()">
        Mostrar texto
    </button>
    <div id="resultado"></div>
    <script>
        function mostrarTexto() {
            texto = document.getElementById("idTexto").value;


            document.getElementById("resultado").innerHTML = texto;
        }
    </script>
    </body>
</html>
